<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INTC-3283 - Welcome</title>
    <link type="text/css" rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.css}">
    <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col">
            <h1>Tax Info Report</h1>

            <table class="table table-striped">
                <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Address 1</th>
                    <th>Address 2</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Zip Code</th>
                    <th>Phone</th>
                    <th>Total Donated</th>
                    <th>Last Donated</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="donation : ${taxInfo}">
                    <td th:text="${donation.firstName}"></td>
                    <td th:text="${donation.lastName}"></td>
                    <td th:text="${donation.address1}"></td>
                    <td th:text="${donation.address2}"></td>
                    <td th:text="${donation.city}"></td>
                    <td th:text="${donation.state}"></td>
                    <td th:text="${donation.zipCode}"></td>
                    <td th:text="${donation.phone}"></td>
                    <td th:text="${'$' + #numbers.formatDecimal(donation.totalDonated, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${donation.lastDonatedOn}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>


</body>
</html>
